<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="paintFlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FECDD3" stop-opacity="0.85" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#450A0A" flood-opacity="0.45" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Radial Sheen Overlay -->
  <circle cx="160" cy="120" r="220" fill="#FFFFFF" opacity="0.12" />

  <!-- Brand Ring / Decorative Orbital Segment -->
  <path d="M 120 260 A 140 140 0 1 1 392 260" fill="none" stroke="#FEE2E2" stroke-width="4" stroke-dasharray="8 6" opacity="0.35" />

  <!-- Main Center Emblem: Dynamic Stylized Nippon 'N' with Paint Splash Droplet -->
  <g filter="url(#shadow)">
    <!-- Left Pillar of 'N' with Paint Roller / Can Curve -->
    <path d="M 148 160 C 148 146.7 158.7 136 172 136 C 185.3 136 196 146.7 196 160 L 196 320 C 196 333.3 185.3 344 172 344 C 158.7 344 148 333.3 148 320 Z" fill="url(#accentGrad)" />

    <!-- Diagonal Dynamic Stroke with Paint Tip -->
    <path d="M 172 152 L 322 308 C 328 314 334 318 340 320 L 340 332 C 340 338.6 334.6 344 328 344 C 322 344 316 341 311 336 L 160 180 C 154 174 152 168 152 162 Z" fill="url(#paintFlow)" opacity="0.9" />

    <!-- Right Pillar of 'N' -->
    <path d="M 316 184 C 316 170.7 326.7 160 340 160 C 353.3 160 364 170.7 364 184 L 364 320 C 364 333.3 353.3 344 340 344 C 326.7 344 316 333.3 316 320 Z" fill="url(#accentGrad)" />

    <!-- Dynamic Nippon Red Paint Droplet Accent (Top Right) -->
    <path d="M 340 100 C 340 100 376 138 376 156 C 376 175.9 359.9 192 340 192 C 320.1 192 304 175.9 304 156 C 304 138 340 100 340 100 Z" fill="url(#goldGrad)" filter="url(#shadow)" />

    <!-- Paint Droplet Highlight -->
    <ellipse cx="332" cy="148" rx="8" ry="14" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 332 148)" />
  </g>

  <!-- Golden Rating / Quality Crown Star Badge -->
  <g transform="translate(256, 386)">
    <!-- Pill Container for "SALE PRO" -->
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#1E293B" opacity="0.85" />
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#FFFFFF">
      NIPPON SALE
    </text>
  </g>
</svg>
