<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#DC2626" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Emblem Icon Badge -->
  <g filter="url(#logoShadow)">
    <rect x="8" y="10" width="60" height="60" rx="16" fill="url(#logoBgGrad)" />
    
    <!-- Stylized 'N' in emblem -->
    <path d="M 23 23 C 23 21.3 24.3 20 26 20 C 27.7 20 29 21.3 29 23 L 29 47 C 29 48.7 27.7 50 26 50 C 24.3 50 23 48.7 23 47 Z" fill="#FFFFFF" />
    <path d="M 26 22 L 46 45 C 47.5 46.5 49 48 51 48 C 52 48 53 47.5 53 46.5 L 53 23 C 53 21.3 51.7 20 50 20 C 48.3 20 47 21.3 47 23 L 47 38 L 31 20 C 29.5 18.5 27 18.5 25.5 20 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 47 24 C 47 22.3 48.3 21 50 21 C 51.7 21 53 22.3 53 24 L 53 47 C 53 48.7 51.7 50 50 50 C 48.3 50 47 48.7 47 47 Z" fill="#FFFFFF" />

    <!-- Gold Paint Drop Accent -->
    <path d="M 50 14 C 50 14 56 20 56 23 C 56 26.3 53.3 29 50 29 C 46.7 29 44 26.3 44 23 C 44 20 50 14 50 14 Z" fill="url(#logoGold)" />
  </g>

  <!-- Typography: NIPPON SALE -->
  <g transform="translate(82, 0)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="#0F172A" class="fill-slate-900 dark:fill-white">
      NIPPON
    </text>
    <text x="108" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="#DC2626">
      SALE
    </text>

    <!-- Subtitle: Pro Portal & Loei -->
    <rect x="0" y="47" width="58" height="18" rx="4" fill="#DC2626" />
    <text x="29" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="10" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
      PRO
    </text>

    <text x="66" y="60" font-family="'Prompt', system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748B">
      ระบบบริหารงานขายสีนิปปอน
    </text>
  </g>
</svg>
